{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grant-sift.secretName" . }}
  labels:
    {{- include "grant-sift.labels" . | nindent 4 }}
type: Opaque
stringData:
  GRANT_SIFT_LLM_API_KEY: {{ required "secrets.GRANT_SIFT_LLM_API_KEY is required (or set secrets.existingSecret)" .Values.secrets.GRANT_SIFT_LLM_API_KEY | quote }}
  {{- with .Values.secrets.GRANT_SIFT_SAM_API_KEY }}
  GRANT_SIFT_SAM_API_KEY: {{ . | quote }}
  {{- end }}
{{- /*
  The SAM.gov key is set once on the cluster (kubectl patch) and kept here,
  so it never has to sit in a values file. Without this every upgrade
  rebuilt the Secret from values and silently dropped it. lookup reads
  nothing under `helm template` or --dry-run, so those show it missing;
  a real upgrade keeps it.
*/}}
{{- if not .Values.secrets.GRANT_SIFT_SAM_API_KEY }}
{{- $live := lookup "v1" "Secret" .Release.Namespace (include "grant-sift.secretName" .) | default dict }}
{{- with dig "data" "GRANT_SIFT_SAM_API_KEY" "" $live }}
data:
  GRANT_SIFT_SAM_API_KEY: {{ . }}
{{- end }}
{{- end }}
{{- end }}
