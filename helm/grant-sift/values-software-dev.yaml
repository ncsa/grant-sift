# Hand-rolled overlay for the software-dev cluster (context: software-dev).
# Not Argo-managed yet — install with helm upgrade --install.
#
# Cluster facts this file assumes:
#   - ingress class: traefik (+ letsencrypt via certresolver)
#   - RWX storage: nfs-taiga (default); block storage: csi-cinder-sc-retain
#   - wildcard DNS: *.software-dev.ncsa.illinois.edu
#   - Keycloak: https://keycloak.software-dev.ncsa.illinois.edu
#   - pod CIDR (k3s): 10.42.0.0/16
#
# Pair with a local values-secrets.yaml (gitignored). See README.md.

image:
  repository: ghcr.io/ncsa/grant-sift
  tag: main
  pullPolicy: Always

# Image is public on GHCR — no pull secret required.
imagePullSecrets: []

# SQLite lives on Cinder block storage, not nfs-taiga (#25). Over NFS every
# request paid a network round-trip per statement - 150 ms for two tiny
# queries, 2-5 s for a first page load - and WAL's shared-memory index is not
# coherent over NFS at all.
#
# An existing claim because the chart's own claim, grant-sift-data, was bound
# on nfs-taiga and a PVC's storage class and access modes are immutable. The
# Cinder claim is created, and the data copied onto it, by
# scripts/k8s-migrate-db-to-cinder.sh. The old NFS claim is kept (resource
# policy "keep") as the rollback: set existingClaim to grant-sift-data and
# upgrade to go back.
persistence:
  enabled: true
  existingClaim: grant-sift-data-cinder
  storageClassName: csi-cinder-sc-retain
  accessModes:
    - ReadWriteOnce
  size: 2Gi

# Local file config/roster.yaml (gitignored). Create before install:
#   kubectl -n grant-sift create configmap grant-sift-roster \
#     --from-file=roster.yaml=config/roster.yaml
roster:
  existingConfigMap: grant-sift-roster
  key: roster.yaml
  mountPath: /app/config/roster.yaml
  staffKey: ncsa_staff.yaml
  staffMountPath: /app/config/ncsa_staff.yaml

# Change realm here — issuer becomes {{url}}/realms/{{realm}} for oauth2-proxy.
keycloak:
  url: https://keycloak.software-dev.ncsa.illinois.edu
  realm: NCSA

config:
  GRANT_SIFT_DB: /data/grant-sift.db
  GRANT_SIFT_AUTH: proxy
  # oauth2-proxy pods talk to the app from the pod network
  GRANT_SIFT_TRUSTED_PROXIES: "10.42.0.0/16"
  # Not x-forwarded-user — that is Keycloak's subject UUID with keycloak-oidc.
  GRANT_SIFT_AUTH_USER_HEADER: x-forwarded-preferred-username
  GRANT_SIFT_AUTH_EMAIL_HEADER: x-forwarded-email
  GRANT_SIFT_AUTH_NAME_HEADER: x-forwarded-preferred-username
  GRANT_SIFT_AUTH_GROUPS_HEADER: x-forwarded-groups
  # Optional: require a Keycloak group, e.g. grant-sift-users
  GRANT_SIFT_AUTH_REQUIRED_GROUP: ""
  # Public origin: names the /mcp resource in its OAuth metadata and is the
  # Host the MCP endpoint accepts (DNS-rebinding check).
  GRANT_SIFT_PUBLIC_URL: https://grant-sift.software-dev.ncsa.illinois.edu
  GRANT_SIFT_LLM_BASE_URL: https://lumen.ncsa.illinois.edu/v1
  GRANT_SIFT_LLM_MODEL: gemma-4-31b-it
  GRANT_SIFT_FROM: grant-sift@ncsa.illinois.edu
  # Campus outbound relay (Tech Services KB 47888). Needs a campus-recognized
  # source IP — pod CIDR 10.42/16 often cannot use this; if digests fail to
  # send, use Cloud Email Delivery (SocketLabs) or a campus SMTP sidecar.
  # https://answers.uillinois.edu/illinois/47888
  GRANT_SIFT_SMTP_HOST: outbound-relays.techservices.illinois.edu
  GRANT_SIFT_SMTP_PORT: "25"
  # Nightly pipeline, in the serving process.
  GRANT_SIFT_DAILY_AT: "06:00"
  GRANT_SIFT_DAILY_TZ: America/Chicago
  GRANT_SIFT_DAILY_CATCHUP: "on"
  # Header-strip "Ops & signal" link (opens Grafana; no iframe). Empty hides it.
  GRANT_SIFT_GRAFANA_URL: "https://grant-sift-grafana.software-dev.ncsa.illinois.edu/d/grant-sift-ops-signal?orgId=1&from=now-90d&to=now&theme=light&refresh=5m"

# Grafana OSS in this namespace (Infinity → grant-sift:8080/api/stats).
# Create admin + OIDC client secret once (see GRAFANA.md). No Prometheus.
# Login: same Keycloak realm as the dashboard (Generic OAuth).
grafana:
  enabled: true
  keycloakAuth:
    enabled: true
    clientId: grant-sift-grafana
  admin:
    existingSecret: grant-sift-grafana
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    server:
      root_url: https://grant-sift-grafana.software-dev.ncsa.illinois.edu/
      domain: grant-sift-grafana.software-dev.ncsa.illinois.edu
    users:
      auto_assign_org_role: Editor
    security:
      allow_embedding: true
      cookie_samesite: none
      cookie_secure: true
    auth:
      disable_login_form: false   # keep admin break-glass
      oauth_auto_login: false
    auth.anonymous:
      enabled: true
      org_name: Main Org.
      org_role: Viewer
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      allow_sign_up: true
      client_id: grant-sift-grafana
      scopes: openid email profile
      email_attribute_path: email
      login_attribute_path: preferred_username
      name_attribute_path: name
      use_pkce: true
      # URLs + client_secret come from env (ConfigMap / Secret) below.
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_AUTH_URL:
      configMapKeyRef:
        name: grant-sift-keycloak
        key: auth-url
    GF_AUTH_GENERIC_OAUTH_TOKEN_URL:
      configMapKeyRef:
        name: grant-sift-keycloak
        key: token-url
    GF_AUTH_GENERIC_OAUTH_API_URL:
      configMapKeyRef:
        name: grant-sift-keycloak
        key: api-url
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grant-sift-grafana
        key: client-secret
  persistence:
    enabled: true
    storageClassName: nfs-taiga
    size: 2Gi
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grant-sift-grafana.software-dev.ncsa.illinois.edu
    path: /
    pathType: Prefix
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
      traefik.ingress.kubernetes.io/router.middlewares: redirect-web-to-443@internal
    tls:
      - hosts:
          - grant-sift-grafana.software-dev.ncsa.illinois.edu
        secretName: grant-sift-grafana-tls

# Users hit oauth2-proxy Ingress, not the app Service directly.
ingress:
  enabled: false

oauth2-proxy:
  enabled: true
  config:
    # kubectl -n grant-sift create secret generic grant-sift-oauth2 \
    #   --from-literal=client-id=grant-sift \
    #   --from-literal=client-secret=... \
    #   --from-literal=cookie-secret="$(python3 -c 'import secrets,base64; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())')"
    existingSecret: grant-sift-oauth2
    configFile: |-
      provider = "keycloak-oidc"
      email_domains = [ "*" ]
      upstreams = [ "http://grant-sift:8080/" ]
      # /api/focus is a long request by design: parallel catalogue chunks then
      # a rank pass, each allowed GRANT_SIFT_CHAT_TIMEOUT (120s) against the
      # viewer's gateway. oauth2-proxy defaults to 30s, which cut the request
      # off mid-flight and returned its own HTML 502 - no "detail" field, so
      # the browser fell back to a bare "focus failed (502)" and the real
      # cause never reached the user. Sits above the app's own ceiling so the
      # app's error message wins the race.
      upstream_timeout = "180s"
      skip_provider_button = true
      set_xauthrequest = true
      pass_access_token = false
      pass_authorization_header = false
      pass_user_headers = true
      set_authorization_header = false
      oidc_email_claim = "email"
      oidc_groups_claim = "groups"
      user_id_claim = "preferred_username"
      # MCP clients (Claude Code, Claude Desktop) cannot follow a cookie login.
      # They log in to Keycloak themselves, as the public client grant-sift-mcp,
      # and send the access token as "Authorization: Bearer". This accepts a
      # valid one and sets the same X-Forwarded-* headers a browser session
      # gets. The token's aud must include this proxy's client id: add an
      # Audience mapper to grant-sift-mcp (helm/grant-sift/README.md).
      skip_jwt_bearer_tokens = true
      # 401 instead of a 302 to the login page, which an MCP client cannot use.
      api_routes = [ "^/mcp" ]
      # Where the client learns which realm to log in against; it has no token yet.
      skip_auth_routes = [ "GET=^/[.]well-known/oauth-protected-resource" ]
  extraArgs:
    - --provider=keycloak-oidc
    - --user-id-claim=preferred_username
    - --oidc-email-claim=email
    - --reverse-proxy=true
    - --pass-user-headers=true
    - --set-xauthrequest=true
    - --code-challenge-method=S256
  extraEnv:
    - name: OAUTH2_PROXY_OIDC_ISSUER_URL
      valueFrom:
        configMapKeyRef:
          name: grant-sift-keycloak
          key: issuer-url
  ingress:
    enabled: true
    className: traefik
    path: /
    pathType: Prefix
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
      traefik.ingress.kubernetes.io/router.middlewares: redirect-web-to-443@internal
    hosts:
      - grant-sift.software-dev.ncsa.illinois.edu
    tls:
      - hosts:
          - grant-sift.software-dev.ncsa.illinois.edu
        secretName: grant-sift-tls
